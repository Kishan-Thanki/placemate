<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Placemate - Redirecting</title>
    <script>
        // Single Page App (SPA) fallback - redirect all routes to index.html
        const path = window.location.pathname + window.location.search + window.location.hash;
        
        // Only redirect if this is a client-side route (not a file)
        if (!path.match(/\.(js|css|png|jpg|jpeg|gif|ico|json|txt|xml)$/)) {
            // Store the original path for the main app to use
            sessionStorage.setItem('originalPath', path);
            
            // Redirect to root - React Router will handle the actual routing
            window.location.replace('/');
        }
    </script>
</head>
<body>
    <noscript>
        <h1>Placemate - Campus Recruitment System</h1>
        <p>JavaScript is required to run this application.</p>
        <p><a href="/">Go to Home Page</a></p>
    </noscript>
    
    <div style="text-align: center; margin-top: 50px;">
        <h2>Redirecting to Placemate...</h2>
        <p>If you are not redirected automatically, <a href="/">click here</a>.</p>
    </div>
</body>
</html>
