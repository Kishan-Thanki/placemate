version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placemate-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-placemate.settings.production}
    # No volume mounts for production - use container code
    restart: unless-stopped
    # Production command uses Gunicorn (default from Dockerfile)
    # Override workers based on CPU cores: (2 * CPU) + 1
    command: >
      gunicorn placemate.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --timeout 120
      --keep-alive 5
      --max-requests 1000
      --max-requests-jitter 50
      --access-logfile -
      --error-logfile -
      --log-level info
    networks:
      - placemate-network

networks:
  placemate-network:
    driver: bridge

